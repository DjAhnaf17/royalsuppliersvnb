<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Suppliers | Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
        }
        .admin-header {
            background: rgba(11, 15, 25, 0.95);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
            margin-bottom: 2rem;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #d4af37;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            color: #000;
            font-weight: 600;
            border: none;
            transition: transform 0.3s ease;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .text-gold {
            color: #d4af37;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .gallery-item {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.05);
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .delete-btn:hover {
            background: #bb2d3b;
        }
        #login-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="admin-header d-none" id="admin-header">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="mb-0 fw-bold"><span class="text-gold">Admin</span> Portal</h4>
            <div>
                <a href="index.html" class="btn btn-outline-light btn-sm me-2">View Site</a>
                <button class="btn btn-outline-danger btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        
        <!-- Login Section -->
        <div id="login-section" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="admin-card text-center">
                    <h3 class="fw-bold mb-1"><span class="text-gold">Admin</span> Login</h3>
                    <p class="text-muted small mb-4">Enter your GitHub PAT to continue</p>
                    <form id="login-form">
                        <div class="mb-3 text-start">
                            <input type="password" class="form-control form-control-lg" id="pat-input" required placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
                        </div>
                        <button type="submit" class="btn btn-gold w-100 btn-lg">Secure Login <i class="bi bi-arrow-right ms-2"></i></button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="d-none pb-5">
            <div id="alert-box" class="alert d-none mb-4" role="alert"></div>

            <div class="row g-4">
                <!-- Upload Column -->
                <div class="col-lg-4">
                    <div class="admin-card position-sticky" style="top: 20px;">
                        <h5 class="fw-bold mb-3">Upload New Image</h5>
                        <form id="upload-form">
                            <div class="mb-3">
                                <label for="gallery-image" class="form-label text-light small fw-semibold">Select File (JPG, PNG)</label>
                                <input class="form-control bg-dark" type="file" id="gallery-image" accept="image/png, image/jpeg" required>
                            </div>
                            <button type="submit" class="btn btn-gold w-100" id="upload-btn">
                                <i class="bi bi-cloud-arrow-up-fill me-2"></i> Upload to Gallery
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Gallery Column -->
                <div class="col-lg-8">
                    <div class="admin-card h-100">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0">Current Gallery</h5>
                            <button class="btn btn-sm btn-outline-light" id="refresh-gallery-btn">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                        <div id="gallery-grid" class="gallery-grid">
                            <!-- Images will load here -->
                            <div class="text-center w-100 text-muted py-5 col-span-full">Loading gallery...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="static/admin.js"></script>
</body>
</html>
