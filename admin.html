<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Suppliers | Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #d4af37;
            color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4af37, #f3e5ab);
            color: #000;
            font-weight: 600;
            border: none;
            transition: transform 0.3s ease;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }
        .text-gold {
            color: #d4af37;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="admin-card">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold"><span class="text-gold">Admin</span> Portal</h2>
                        <p class="text-muted small">Upload new images to your dynamic gallery</p>
                    </div>

                    <div id="alert-box" class="alert d-none" role="alert"></div>

                    <form id="upload-form">
                        <div class="mb-3">
                            <label for="pat-token" class="form-label text-light small fw-semibold">GitHub Personal Access Token (PAT)</label>
                            <input type="password" class="form-control" id="pat-token" required placeholder="ghp_xxxxxxxxxxxxxxxxx">
                        </div>
                        <div class="mb-4">
                            <label for="gallery-image" class="form-label text-light small fw-semibold">Select Image (JPG, PNG)</label>
                            <input class="form-control" type="file" id="gallery-image" accept="image/png, image/jpeg" required>
                        </div>
                        <button type="submit" class="btn btn-gold w-100" id="upload-btn">
                            <i class="bi bi-cloud-arrow-up-fill me-2"></i> Upload to Gallery
                        </button>
                    </form>
                    
                    <div class="mt-4 text-center">
                        <a href="index.html" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Back to main site</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="static/admin.js"></script>
</body>
</html>
